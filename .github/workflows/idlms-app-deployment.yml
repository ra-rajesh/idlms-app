name: "idlms-app deploy"
on:
  workflow_dispatch:
    inputs:
      ENV:
        description: "Environment (dev/stage/prod)"
        required: true
        default: "dev"
      BRANCH:
        description: "Git ref (branch/tag)"
        required: true
        default: "main"

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

  # Dynamic names (no hardcoding)
  TF_BUCKET: ${{ inputs.ENV }}-btl-platform-main-repo-backend-tfstate-${{ secrets.AWS_ACCOUNT_ID }}
  ARTIFACT_BUCKET: ${{ inputs.ENV }}-btl-platform-main-repo-backend-artifact-${{ secrets.AWS_ACCOUNT_ID }}
  TF_LOCK_TABLE: ${{inputs.ENV}}-platform-main-state-lock
  TF_STATE_PREFIX: ${{ inputs.ENV }}/${{vars.APP_NAME}}

  # repo-specific
  ECR_REPO: ${{ inputs.ENV }}-${{vars.APP_NAME}}
  ARTIFACT_PREFIX: ${{vars.APP_NAME}}

  # derived defaults (not inputs)
  EC2_NAME: ${{ inputs.ENV }}-compute
  REST_API_NAME: ${{ inputs.ENV }}-apigateway
  APP_ENV_SSM_PARAM: /platform-main/${{ inputs.ENV }}/${{vars.APP_NAME}}/.env

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.ENV }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.BRANCH }}

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Set Terraform env vars (bucket, region, lock table)
        run: |
          # feed module variables via env (no need to keep them in .tfvars files)
          echo "TF_VAR_tf_bucket=${{ env.TF_BUCKET }}" >> $GITHUB_ENV
          echo "TF_VAR_lock_table=${{ env.TF_LOCK_TABLE }}" >> $GITHUB_ENV
          echo "TF_VAR_tf_state_bucket=${{ env.TF_BUCKET }}" >> $GITHUB_ENV
          echo "TF_VAR_tf_state_region=${{ env.AWS_REGION }}" >> $GITHUB_ENV

      # 1) SSM parameter for app env
      - name: terraform apply - ssm parameter
        working-directory: infra/environments/${{ inputs.ENV }}/stacks/ssm-app-env
        run: |
          set -euo pipefail
          terraform init -reconfigure \
            -backend-config="bucket=${TF_BUCKET}" \
            -backend-config="key=${TF_STATE_PREFIX}/ssm-app-env/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}"
          terraform apply -auto-approve -var-file="${{ inputs.ENV }}.tfvars"

      # 2) CloudWatch app log group (with retention)
      - name: terraform apply - cloudwatch (app log group)
        working-directory: infra/environments/${{ inputs.ENV }}/stacks/cloudwatch
        run: |
          set -euo pipefail
          terraform init -reconfigure \
            -backend-config="bucket=${TF_BUCKET}" \
            -backend-config="key=${TF_STATE_PREFIX}/cloudwatch/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}"
          # remove just in case name drift happened previously
          terraform state rm aws_cloudwatch_log_group.app || true
          terraform apply -auto-approve -var-file="${{ inputs.ENV }}.tfvars"

      # 3) Security Group: open app port (e.g., 4000) on platform compute SG
      - name: terraform apply - security-group
        working-directory: infra/environments/${{ inputs.ENV }}/stacks/security-group
        run: |
          set -euo pipefail
          terraform init -reconfigure \
            -backend-config="bucket=${TF_BUCKET}" \
            -backend-config="key=${TF_STATE_PREFIX}/security-group/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}"
          terraform apply -auto-approve -var-file="${{ inputs.ENV }}.tfvars"

      # 4) NLB: TG + Listener + attach EC2
      - name: terraform apply - nlb
        working-directory: infra/environments/${{ inputs.ENV }}/stacks/nlb
        run: |
          set -euo pipefail
          terraform init -reconfigure \
            -backend-config="bucket=${TF_BUCKET}" \
            -backend-config="key=${TF_STATE_PREFIX}/nlb/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}"
          terraform apply -auto-approve -var-file="${{ inputs.ENV }}.tfvars"

      # 5) REST API
      - name: terraform apply - rest-api
        working-directory: infra/environments/${{ inputs.ENV }}/stacks/rest-api
        run: |
          set -euo pipefail
          terraform init -reconfigure \
            -backend-config="bucket=${TF_BUCKET}" \
            -backend-config="key=${TF_STATE_PREFIX}/rest-api/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}"
          terraform apply -auto-approve -var-file="${{ inputs.ENV }}.tfvars"

      - name: Publish API Gateway deployment
        run: |
          set -euo pipefail
          REST_API_ID=$(aws apigateway get-rest-apis \
            --query "items[?name=='${REST_API_NAME}'].id" \
            --output text \
            --region "${AWS_REGION}")
          if [ -z "$REST_API_ID" ] || [ "$REST_API_ID" = "None" ]; then
            echo "ERROR: Could not resolve REST API id for '${REST_API_NAME}'"; exit 1
          fi
          aws apigateway create-deployment \
            --rest-api-id "$REST_API_ID" \
            --stage-name "${{ inputs.ENV }}" \
            --region "${AWS_REGION}"

      # 6) ECR: ensure repo exists
      - name: terraform apply - ecr
        working-directory: infra/environments/${{ inputs.ENV }}/stacks/ecr
        run: |
          set -euo pipefail
          terraform init -reconfigure \
            -backend-config="bucket=${TF_BUCKET}" \
            -backend-config="key=${TF_STATE_PREFIX}/ecr/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}"
          terraform apply -auto-approve -var-file="${{ inputs.ENV }}.tfvars"

      # 7) Resolve canonical ECR URL from SSM (prevents name drift)
      - name: Resolve ECR_REPO_URL from SSM
        run: |
          set -euo pipefail
          ENV="${{ inputs.ENV }}"
          REPO="${{ env.ECR_REPO }}"
          URL=$(aws ssm get-parameter \
            --name "/platform-main/${ENV}/ecr/${REPO}/repository_url" \
            --query 'Parameter.Value' \
            --output text \
            --region "${AWS_REGION}")
          echo "ECR_REPO_URL=${URL}" >> "$GITHUB_ENV"

      # 8) Build & push image (Dockerfile is docker/Dockerfile; context = src)
      - name: Compute STAMP & BUILD_TAG
        run: |
          set -euo pipefail
          echo "STAMP=$(date +'%Y-%m-%d_%H%M%S')" >> "$GITHUB_ENV"
          echo "BUILD_TAG=$(date +'%Y.%m.%d.%H%M%S')" >> "$GITHUB_ENV"

      - name: ECR login
        run: |
          set -euo pipefail
          REGISTRY="${ECR_REPO_URL%%/*}"
          aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "$REGISTRY"

      - name: Build image (tag with BUILD_TAG and latest)
        run: |
          set -euo pipefail
          docker build -f docker/Dockerfile \
            -t "${ECR_REPO_URL}:${BUILD_TAG}" \
            -t "${ECR_REPO_URL}:latest" \
            src

      - name: Push images (BUILD_TAG and latest)
        run: |
          set -euo pipefail
          docker push "${ECR_REPO_URL}:${BUILD_TAG}"
          docker push "${ECR_REPO_URL}:latest"

      # 9) Upload versioned docker-compose + LATEST pointer
      - name: Upload compose to S3 (releases + LATEST)
        run: |
          set -euo pipefail
          aws s3 cp docker/docker-compose.yml "s3://${ARTIFACT_BUCKET}/${ARTIFACT_PREFIX}/releases/${STAMP}/docker-compose.yml" --region "${AWS_REGION}"
          printf "releases/%s" "${STAMP}" | aws s3 cp - "s3://${ARTIFACT_BUCKET}/${ARTIFACT_PREFIX}/LATEST" --region "${AWS_REGION}"

      # 10) Also upload a flat path for simple pickup (s3://<bucket>/<env>/docker-compose.yml)
      - name: Upload docker-compose.yml to S3 (flat path)
        env:
          BACKUP_BUCKET: ${{ env.ARTIFACT_BUCKET }}
        run: |
          set -euo pipefail
          echo "Uploading flat compose to: s3://${BACKUP_BUCKET}/${{ inputs.ENV }}/docker-compose.yml"
          aws s3 cp docker/docker-compose.yml \
            "s3://${BACKUP_BUCKET}/${{ inputs.ENV }}/docker-compose.yml" \
            --region "${AWS_REGION}"

      # 11) Deploy via SSM
      - name: Deploy via SSM (single service + health + rollback)
        env:
          ENV: ${{ inputs.ENV }}
          AWS_REGION: ${{ env.AWS_REGION }}
          ECR_REPO_URL: ${{ env.ECR_REPO_URL }}
          ARTIFACT_BUCKET: ${{ env.ARTIFACT_BUCKET }}
          ARTIFACT_PREFIX: ${{ env.ARTIFACT_PREFIX }}
          # if ROLLBACK_TAG provided, use it; else use the freshly built BUILD_TAG
          BUILD_TAG: ${{ inputs.ROLLBACK_TAG != '' && inputs.ROLLBACK_TAG || env.BUILD_TAG }}
          SERVICE_NAME: api1
          HEALTH_URL: http://localhost:4000/health
        run: |
          set -euo pipefail
          # 1) find target instance
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${ENV}-compute" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --region "${AWS_REGION}" --output text)
          [ -n "$INSTANCE_ID" ] && [ "$INSTANCE_ID" != "None" ] || { echo "No ${ENV}-compute running"; exit 1; }

          # 2) build remote script
          REMOTE=$(cat <<'BASH'
          set -euo pipefail
          ENV="__ENV__"; REGION="__REGION__"; ECR="__ECR__"; BKT="__BKT__"; PREF="__PREF__"; TAG="__TAG__"
          SERVICE_NAME="__SERVICE_NAME__"; HEALTH_URL="__HEALTH_URL__"
          LAST_GOOD_PARAM="/platform-main/${ENV}/${{vars.APP_NAME}}/last-successful-build"
          APP_DIR="/opt/${ENV}/${{vars.APP_NAME}}"
          mkdir -p "$APP_DIR"

          # basics
          if ! command -v aws >/dev/null 2>&1; then
            apt-get update -y
            DEBIAN_FRONTEND=noninteractive apt-get install -y awscli
          fi
          if ! command -v docker >/dev/null 2>&1; then
            apt-get update -y
            DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io
            systemctl enable --now docker || true
          fi
          if ! docker compose version >/dev/null 2>&1; then
            mkdir -p /usr/local/lib/docker/cli-plugins
            curl -fsSL "https://github.com/docker/compose/releases/download/v2.27.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/lib/docker/cli-plugins/docker-compose
            chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          fi
          command -v curl >/dev/null 2>&1 || { apt-get update -y && DEBIAN_FRONTEND=noninteractive apt-get install -y curl; }

          # env + compose from SSM + S3
          aws ssm get-parameter --region "$REGION" --name "/platform-main/${ENV}/${{vars.APP_NAME}}/.env" --with-decryption --query "Parameter.Value" --output text > "$APP_DIR/.env"

          # guarantee required keys for compose substitution
          grep -q '^ENV=/d' "$APP_DIR/.env" || echo "ENV=${ENV}" >> "$APP_DIR/.env"
          grep -q '^AWS_REGION=/d' "$APP_DIR/.env" || echo "AWS_REGION=${REGION}" >> "$APP_DIR/.env"
          sed -i '/^BUILD_TAG=/d' "$APP_DIR/.env"; echo "BUILD_TAG=$TAG" >> "$APP_DIR/.env"
          sed -i '/^IMAGE_REPO=/d' "$APP_DIR/.env"; echo "IMAGE_REPO=$ECR" >> "$APP_DIR/.env"
          grep -q '^PORT=' "$APP_DIR/.env" || echo "PORT=4000" >> "$APP_DIR/.env"
          EFFECTIVE_PORT="$(grep -E '^PORT=' "$APP_DIR/.env" | tail -1 | cut -d= -f2-)"; [ -n "$EFFECTIVE_PORT" ] || EFFECTIVE_PORT=4000

          # ensure the CloudWatch log group exists (defensive; Terraform already created it)
          LOG_GROUP="/${ENV}/platform_main/apps/${{vars.APP_NAME}}/logs"
          if ! aws logs describe-log-groups --region "$REGION" \
               --log-group-name-prefix "$LOG_GROUP" \
               --query "logGroups[?logGroupName=='$LOG_GROUP'] | length(@)" --output text | grep -q '^1$'; then
            aws logs create-log-group --region "$REGION" --log-group-name "$LOG_GROUP" || true
            aws logs put-retention-policy --region "$REGION" --log-group-name "$LOG_GROUP" --retention-in-days 14 || true
          fi

          # pull versioned compose via LATEST pointer (or fallback)
          if aws s3 ls "s3://$BKT/$PREF/LATEST" --region "$REGION" >/dev/null 2>&1; then
            LATEST_PATH="$(aws s3 cp "s3://$BKT/$PREF/LATEST" - --region "$REGION")"
            aws s3 cp "s3://$BKT/$PREF/$LATEST_PATH/docker-compose.yml" "$APP_DIR/docker-compose.yml" --region "$REGION"
          else
            aws s3 cp "s3://$BKT/$PREF/docker-compose.yml" "$APP_DIR/docker-compose.yml" --region "$REGION"
          fi

          # ECR login (registry only)
          REGISTRY="${ECR%%/*}"
          aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$REGISTRY"

          # free the host port if another stray container holds it (not ours)
          CONFLICT_IDS=$(docker ps --format '{{.ID}} {{.Ports}}' | awk -v p="$EFFECTIVE_PORT" '$0 ~ p"/tcp" {print $1}')
          if [ -n "$CONFLICT_IDS" ]; then
            OUR_IDS=$(docker compose --project-name ${{vars.APP_NAME}} --env-file "$APP_DIR/.env" -f "$APP_DIR/docker-compose.yml" ps -q "$SERVICE_NAME" || true)
            for cid in $CONFLICT_IDS; do
              echo "$OUR_IDS" | grep -q "$cid" && continue
              docker stop "$cid" || true
              docker rm -f "$cid" || true
            done
          fi

          # deploy only the selected service
          docker compose --project-name ${{vars.APP_NAME}} --env-file "$APP_DIR/.env" -f "$APP_DIR/docker-compose.yml" pull --ignore-pull-failures "$SERVICE_NAME" || true
          docker compose --project-name ${{vars.APP_NAME}} --env-file "$APP_DIR/.env" -f "$APP_DIR/docker-compose.yml" up -d --force-recreate --build "$SERVICE_NAME"

          # health; rollback if needed
          ok=0; for i in $(seq 1 20); do curl -fsS --max-time 3 "$HEALTH_URL" >/dev/null 2>&1 && { ok=1; break; }; sleep 5; done
          if [ "$ok" -ne 1 ]; then
            prev=$(aws ssm get-parameter --region "$REGION" --name "$LAST_GOOD_PARAM" --query "Parameter.Value" --output text 2>/dev/null || true)
            [ -n "$prev" ] && [ "$prev" != "None" ] || { echo "Health failed and no rollback tag set"; exit 1; }
            sed -i '/^BUILD_TAG=/d' "$APP_DIR/.env"; echo "BUILD_TAG=$prev" >> "$APP_DIR/.env"
            docker compose --project-name ${{vars.APP_NAME}} --env-file "$APP_DIR/.env" -f "$APP_DIR/docker-compose.yml" pull --ignore-pull-failures "$SERVICE_NAME" || true
            docker compose --project-name ${{vars.APP_NAME}} --env-file "$APP_DIR/.env" -f "$APP_DIR/docker-compose.yml" up -d --force-recreate --build "$SERVICE_NAME"
            ok=0; for i in $(seq 1 20); do curl -fsS --max-time 3 "$HEALTH_URL" >/dev/null 2>&1 && { ok=1; break; }; sleep 5; done
            [ "$ok" -eq 1 ] || { echo "Rollback unhealthy"; exit 1; }
            echo "Rolled back to $prev"; exit 0
          fi

          # record success
          aws ssm put-parameter --region "$REGION" --name "$LAST_GOOD_PARAM" --type String --overwrite --value "$TAG"
          docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Ports}}\t{{.Status}}"
          BASH
          )

          # 3) substitute placeholders and run via SSM
          REMOTE_SUB=${REMOTE//__ENV__/${ENV}}
          REMOTE_SUB=${REMOTE_SUB//__REGION__/${AWS_REGION}}
          REMOTE_SUB=${REMOTE_SUB//__ECR__/${ECR_REPO_URL}}
          REMOTE_SUB=${REMOTE_SUB//__BKT__/${ARTIFACT_BUCKET}}
          REMOTE_SUB=${REMOTE_SUB//__PREF__/${ARTIFACT_PREFIX}}
          REMOTE_SUB=${REMOTE_SUB//__TAG__/${BUILD_TAG}}
          REMOTE_SUB=${REMOTE_SUB//__SERVICE_NAME__/${SERVICE_NAME}}
          REMOTE_SUB=${REMOTE_SUB//__HEALTH_URL__/${HEALTH_URL}}
          REMOTE_B64=$(printf "%s" "$REMOTE_SUB" | base64 -w0)

          sudo apt-get update -y && sudo apt-get install -y jq
          CMDS=$(jq -n --arg b64 "$REMOTE_B64" '[
            "set -eu",
            "printf %s " + $b64 + " | base64 -d > /tmp/deploy.sh",
            "chmod +x /tmp/deploy.sh",
            "bash -lc /tmp/deploy.sh"
          ]')

          CMD_ID=$(aws ssm send-command --document-name "AWS-RunShellScript" --instance-ids "$INSTANCE_ID" --cli-binary-format raw-in-base64-out --parameters "{\"commands\": $CMDS}" --timeout-seconds 1800 --region "$AWS_REGION" --query 'Command.CommandId' --output text)

          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --output json
